<!DOCTYPE html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Javascript Modern - 8th Anniversary Edition</title>
    <meta name="description" content="Modernisasi Kalkulator Javascript multi-input dengan validasi, UI Glassmorphism, riwayat perhitungan, dan performa tinggi tanpa dependensi eksternal.">
    <meta name="author" content="iczombie4">
    <meta name="theme-color" content="#0f172a">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><rect width='18' height='18' x='3' y='3' rx='4'/><path d='M8 7h8M8 12h8M8 17h8' stroke='white' stroke-width='2'/></svg>">
  </head>
  <body>
    <!-- Ambient Background Lighting -->
    <div class="ambient-glow" aria-hidden="true">
      <div class="ambient-blob blob-1"></div>
      <div class="ambient-blob blob-2"></div>
    </div>

    <!-- Application Shell -->
    <main class="app-wrapper">
      
      <!-- App Header -->
      <header class="app-header">
        <div class="brand-section">
          <div class="brand-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="4"></rect>
              <line x1="8" y1="12" x2="16" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="16"></line>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Kalkulator JS</h1>
            <div class="brand-tagline">
              <span>Multi-Input Edition</span>
              <span class="legacy-badge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                8-Year Revamp
              </span>
            </div>
          </div>
        </div>

        <!-- Controls (Sound & Theme) -->
        <div class="header-controls">
          <button type="button" class="icon-btn" id="soundToggleBtn" aria-label="Toggle Sound Effects" title="Aktifkan/Nonaktifkan Suara">
            <!-- Injected via JS -->
          </button>
          <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Toggle Dark/Light Mode" title="Ganti Tema">
            <!-- Injected via JS -->
          </button>
        </div>
      </header>

      <!-- Main Calculator Card -->
      <section class="calc-card" id="calcCard" aria-label="Kalkulator">
        
        <!-- Result Display Screen -->
        <div class="result-display-wrapper">
          <div class="result-header">
            <span class="result-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
              Hasil Perhitungan
            </span>
            <div class="result-actions">
              <button type="button" class="action-pill-btn" id="copyResultBtn" title="Salin hasil ke clipboard">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                Salin
              </button>
            </div>
          </div>
          <div class="result-body">
            <div style="flex-grow: 1; min-width: 0;">
              <div class="result-expression" id="resultExpression">Siap menghitung</div>
              <div class="result-value" id="resultValue">0</div>
            </div>
          </div>
        </div>

        <!-- Inputs Container -->
        <div class="inputs-section">
          <div class="inputs-section-header">
            <span class="section-title">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
              Nilai Input & Validasi Ceklis
            </span>
            <div class="inputs-header-actions">
              <button type="button" class="text-btn" id="selectAllBtn">Batal Ceklis Semua</button>
              <button type="button" class="text-btn" id="clearInputsBtn" style="color: var(--accent-rose);">Reset</button>
            </div>
          </div>

          <!-- Dynamic List of Rows (Starts with A, B, C) -->
          <div class="input-rows-list" id="inputRowsList">
            <!-- Populated by JavaScript -->
          </div>

          <button type="button" class="add-input-btn" id="addInputBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Tambah Baris Input Baru
          </button>
        </div>

        <!-- Validation Mode Switch -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 2px; border-top: 1px solid var(--bg-surface-border); border-bottom: 1px solid var(--bg-surface-border);">
          <label for="requireAllToggle" style="font-size: 0.8rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 8px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Mode Validasi: Ceklis semua baris sebelum menghitung
          </label>
          <input type="checkbox" id="requireAllToggle" class="custom-checkbox" checked>
        </div>

        <!-- Operator Buttons (Primary +, -, *, /) -->
        <div class="operators-wrapper">
          <div class="operators-header">
            <span class="section-title">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
              Operasi Matematika
            </span>
          </div>

          <div class="operator-grid">
            <button type="button" class="op-btn op-add" data-op="+" aria-label="Tambah">
              <span class="op-symbol">+</span>
              <span class="op-name">Tambah</span>
            </button>
            <button type="button" class="op-btn op-sub" data-op="-" aria-label="Kurang">
              <span class="op-symbol">&minus;</span>
              <span class="op-name">Kurang</span>
            </button>
            <button type="button" class="op-btn op-mul" data-op="*" aria-label="Kali">
              <span class="op-symbol">&times;</span>
              <span class="op-name">Kali</span>
            </button>
            <button type="button" class="op-btn op-div" data-op="/" aria-label="Bagi">
              <span class="op-symbol">&divide;</span>
              <span class="op-name">Bagi</span>
            </button>
          </div>

          <!-- Extra Utility Operations -->
          <div class="secondary-operators">
            <button type="button" class="secondary-op-btn" id="opMod" title="Sisa Hasil Bagi">
              <span style="font-family: var(--font-mono); font-weight: bold;">%</span> Modulo
            </button>
            <button type="button" class="secondary-op-btn" id="opAvg" title="Hitung Rata-rata">
              <span style="font-family: var(--font-mono); font-weight: bold;">x̄</span> Rata-rata
            </button>
            <button type="button" class="secondary-op-btn" onclick="document.getElementById('input-a')?.focus()" title="Fokus ke input pertama">
              <span>⌨️</span> Input Cepat
            </button>
          </div>
        </div>

      </section>

      <!-- History Section -->
      <section class="history-section" aria-label="Riwayat Perhitungan">
        <div class="history-header">
          <div class="history-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
            Riwayat Perhitungan
            <span class="history-count" id="historyCount">0</span>
          </div>
          <button type="button" class="text-btn" id="clearHistoryBtn" style="color: var(--accent-rose);">
            Hapus Riwayat
          </button>
        </div>
        <div class="history-list" id="historyList">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Footer -->
      <footer class="app-footer">
        <p>Proyek Kalkulator Javascript &bull; Ditingkatkan dari kode original 2016 ke versi modern 2026</p>
        <div class="footer-links">
          <span>&copy; <a href="https://github.com/iczombie4" target="_blank" rel="noopener">iczombie4</a></span>
          <span>&bull;</span>
          <span>Pure Vanilla HTML, CSS &amp; JavaScript</span>
        </div>
      </footer>

    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Application Script -->
    <script src="js/app.js"></script>
  </body>
</html>
